            (function () {
                const shapes = [[8, 0.43, 0.07], [6, 0.39, 0.11], [11, 0.44, 0.06], [5, 0.42, 0.08]];
                const [n, base, amp] = shapes[Math.floor(Math.random() * shapes.length)];
                const pts = [];
                for (let i = 0; i < 360; i++) {
                    const t = (i / 360) * Math.PI * 2, r = Math.min(0.5, base + amp * Math.cos(n * t)) * 98;
                    pts.push((50 + r * Math.cos(t)).toFixed(2) + " " + (50 + r * Math.sin(t)).toFixed(2));
                }
                document.getElementById("sr-shape-path").setAttribute("d", "M" + pts.join(" L") + " Z");
            })();

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                    const err = document.getElementById("staticrypt-error");

                    err.textContent = templateError;
                    err.classList.remove("hidden");
                    box.classList.remove("is-error");
                    void box.offsetWidth;
                    box.classList.add("is-error");
                    document.getElementById("staticrypt-password").select();
                }
